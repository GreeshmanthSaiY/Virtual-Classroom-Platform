name: Pull Request Validation

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: pr-val-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Frontend Quality Gate (React 18 / TypeScript / Vite / Vitest)
  # ============================================================================
  frontend-validation:
    name: Frontend QA (TypeScript, Vitest, Build, Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend component availability
        id: check-frontend
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Frontend component detected. Proceeding with frontend validation."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend Skipped::Frontend component is not present on this branch. Skipping frontend validation."
          fi

      - name: Set up Node.js 20.x
        if: steps.check-frontend.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from lockfile
        if: steps.check-frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check and production build
        if: steps.check-frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm run build

      - name: Run Vitest unit & contract test suite
        if: steps.check-frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm test -- --run

      - name: Run npm security audit
        if: steps.check-frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Report frontend QA status
        if: always()
        env:
          AVAILABLE: ${{ steps.check-frontend.outputs.available }}
        run: |
          echo "### Frontend QA Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AVAILABLE" = "true" ]; then
            echo "Status: **COMPLETED**" >> "$GITHUB_STEP_SUMMARY"
            echo "Component: React 18 / Vite / TypeScript" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Status: **SKIPPED**" >> "$GITHUB_STEP_SUMMARY"
            echo "Reason: \`frontend/\` directory or \`package.json\` not present on target branch." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # 2. Backend Quality Gate (Spring Boot 3.4.x / Java 21 / Maven)
  # ============================================================================
  backend-validation:
    name: Backend QA (JUnit 5, Mockito, Spring Security, Package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check backend component availability
        id: check-backend
        run: |
          if [ -d "backend" ] && [ -f "backend/pom.xml" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Backend component detected. Proceeding with backend validation."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Backend Skipped::Backend component is not present on this branch. Skipping backend validation."
          fi

      - name: Set up JDK 21 (Temurin)
        if: steps.check-backend.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to Maven wrapper
        if: steps.check-backend.outputs.available == 'true'
        working-directory: backend
        run: chmod +x mvnw

      - name: Run Backend Unit & Integration Tests
        if: steps.check-backend.outputs.available == 'true'
        working-directory: backend
        run: ./mvnw clean test -Dspring.profiles.active=test

      - name: Build production JAR package
        if: steps.check-backend.outputs.available == 'true'
        working-directory: backend
        run: ./mvnw clean package -DskipTests

      - name: Verify JAR artifact existence and size
        if: steps.check-backend.outputs.available == 'true'
        working-directory: backend
        run: |
          JAR_FILE=$(ls target/virtual-classroom-backend-*.jar 2>/dev/null | grep -v 'original' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Production JAR was not generated in target/"
            exit 1
          fi
          echo "Verified JAR package: $JAR_FILE ($(stat -c%s "$JAR_FILE") bytes)"

      - name: Report backend QA status
        if: always()
        env:
          AVAILABLE: ${{ steps.check-backend.outputs.available }}
        run: |
          echo "### Backend QA Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AVAILABLE" = "true" ]; then
            echo "Status: **COMPLETED**" >> "$GITHUB_STEP_SUMMARY"
            echo "Component: Spring Boot 3.4.x / Java 21 / Maven" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Status: **SKIPPED**" >> "$GITHUB_STEP_SUMMARY"
            echo "Reason: \`backend/\` directory or \`pom.xml\` not present on target branch." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # 3. PostgreSQL Migration & Schema Validation (PostgreSQL 16 Container)
  # ============================================================================
  postgres-migration-validation:
    name: PostgreSQL 16 Migration & Integrity Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check migration component availability
        id: check-migration
        run: |
          if [ -d "backend" ] && [ -f "backend/pom.xml" ] && [ -d "backend/src/main/resources/db/migration" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Migration component detected. Proceeding with PostgreSQL migration validation."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PostgreSQL Migration Skipped::Migration scripts or backend not present on this branch. Skipping migration validation."
          fi

      - name: Set up JDK 21 (Temurin)
        if: steps.check-migration.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to Maven wrapper
        if: steps.check-migration.outputs.available == 'true'
        working-directory: backend
        run: chmod +x mvnw

      - name: Install PostgreSQL client utilities
        if: steps.check-migration.outputs.available == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Execute Flyway Migration Safety Test against real PostgreSQL 16
        if: steps.check-migration.outputs.available == 'true'
        working-directory: backend
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/testdb
          POSTGRES_TEST_USER: postgres
          POSTGRES_TEST_PASSWORD: postgrespassword
        run: >
          ./mvnw test -Dtest=FlywayMigrationSafetyTest
          -Dflyway.test.jdbc-url=jdbc:postgresql://localhost:5432/testdb
          -Dflyway.test.user=postgres
          -Dflyway.test.password=postgrespassword

      - name: Validate schema constraints and zero demo users via direct PSQL
        if: steps.check-migration.outputs.available == 'true'
        working-directory: backend
        env:
          PGPASSWORD: postgrespassword
        run: |
          echo "--- Checking applied Flyway schema history ---"
          psql -h localhost -U postgres -d testdb -c "SELECT installed_rank, version, description, type, success FROM flyway_schema_history ORDER BY installed_rank;"
          
          echo "--- Verifying zero demo users remain ---"
          DEMO_COUNT=$(psql -h localhost -U postgres -d testdb -t -c "SELECT COUNT(*) FROM users WHERE email IN ('admin@virtualclassroom.edu', 'dr.jeevan@virtualclassroom.edu', 'gaurav.shukla@virtualclassroom.edu');" | xargs)
          if [ "$DEMO_COUNT" -ne "0" ]; then
            echo "ERROR: Demo users detected in migrated database! Count: $DEMO_COUNT"
            exit 1
          fi
          echo "Demo user count: 0 (Purge verified)"

          echo "--- Verifying foreign key relationships and index integrity ---"
          psql -h localhost -U postgres -d testdb -c "
            SELECT conname, contype, conrelid::regclass AS table_from, confrelid::regclass AS table_to
            FROM pg_constraint
            WHERE contype IN ('f', 'u') AND connamespace = 'public'::regnamespace
            ORDER BY table_from, conname;
          "

      - name: Report migration QA status
        if: always()
        env:
          AVAILABLE: ${{ steps.check-migration.outputs.available }}
        run: |
          echo "### PostgreSQL 16 Migration Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AVAILABLE" = "true" ]; then
            echo "Status: **COMPLETED**" >> "$GITHUB_STEP_SUMMARY"
            echo "Component: Flyway V1..V6 on PostgreSQL 16 Alpine" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Status: **SKIPPED**" >> "$GITHUB_STEP_SUMMARY"
            echo "Reason: Migration scripts or backend not present on target branch." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # 4. Docker Build & Multi-Container Smoke Gate
  # ============================================================================
  docker-validation:
    name: Docker Image Build & Compose Orchestration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker component availability
        id: check-docker
        run: |
          if [ -f "docker-compose.yml" ] && [ -d "backend" ] && [ -d "frontend" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Docker Compose and component directories detected. Proceeding with Docker validation."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Validation Skipped::docker-compose.yml or container contexts not present on this branch. Skipping Docker validation."
          fi

      - name: Set up Docker Buildx
        if: steps.check-docker.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose specification
        if: steps.check-docker.outputs.available == 'true'
        run: docker compose --profile local-db config

      - name: Build Backend Docker Image
        if: steps.check-docker.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: virtual-classroom-backend:ci,virtual-classroom-backend:latest
          load: true

      - name: Build Frontend Docker Image
        if: steps.check-docker.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: virtual-classroom-frontend:ci,virtual-classroom-frontend:latest
          load: true

      - name: Test Docker Compose Startup & Healthchecks
        if: steps.check-docker.outputs.available == 'true'
        env:
          JWT_SECRET: "Y2ktZG9ja2VyLXNtb2tlLXRlc3Qtc2VjcmV0LWtleS0zMmJ5dGVzIQ=="
          SPRING_PROFILES_ACTIVE: "docker"
          DATABASE_URL: "jdbc:postgresql://db:5432/virtual_classroom"
          DATABASE_USERNAME: "postgres"
          DATABASE_PASSWORD: "postgrespassword"
          STORAGE_PROVIDER: "local"
        run: |
          set -euo pipefail

          cleanup() {
            EXIT_CODE=$?
            if [ $EXIT_CODE -ne 0 ]; then
              echo "::error::Docker Compose smoke test failed with exit code $EXIT_CODE"
              echo "=== Diagnostic: Docker Compose PS ==="
              docker compose --profile local-db ps || true
              echo "=== Diagnostic: PostgreSQL (db) Logs ==="
              docker compose --profile local-db logs db --tail=100 || true
              echo "=== Diagnostic: Backend Container Logs ==="
              docker compose --profile local-db logs backend --tail=150 || true
              echo "=== Diagnostic: Frontend Container Logs ==="
              docker compose --profile local-db logs frontend --tail=50 || true
              echo "=== Diagnostic: Frontend Health Details ==="
              docker inspect --format='{{range .State.Health.Log}}{{.ExitCode}}: {{.Output}}{{end}}' virtual-classroom-frontend || true
            fi
            echo "=== Cleaning up Docker Compose resources ==="
            docker compose --profile local-db down -v --remove-orphans || true
          }
          trap cleanup EXIT

          echo "=== 1. Starting PostgreSQL service (db) ==="
          docker compose --profile local-db up -d db

          echo "=== 2. Waiting for PostgreSQL to report healthy ==="
          timeout 60 bash -c 'until docker compose --profile local-db ps db | grep -q "(healthy)"; do sleep 2; done'
          docker compose --profile local-db ps db

          echo "=== 3. Starting backend and frontend services ==="
          docker compose --profile local-db up -d backend frontend

          echo "=== 4. Waiting for all services to report healthy ==="
          # Expecting 3 healthy containers: db, backend, frontend
          timeout 120 bash -c 'until [ $(docker compose --profile local-db ps | grep -c "(healthy)") -ge 3 ]; do sleep 3; done'

          echo "=== 5. Active Container Status ==="
          docker compose --profile local-db ps

          echo "=== 6. Probing Service Health Endpoints ==="
          docker compose --profile local-db exec -T backend wget -qO- http://localhost:8080/actuator/health
          echo ""
          docker compose --profile local-db exec -T frontend wget -qO- http://127.0.0.1:80/healthz
          echo ""
          echo "Docker Compose smoke test completed successfully."

      - name: Report Docker QA status
        if: always()
        env:
          AVAILABLE: ${{ steps.check-docker.outputs.available }}
        run: |
          echo "### Docker Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AVAILABLE" = "true" ]; then
            echo "Status: **COMPLETED**" >> "$GITHUB_STEP_SUMMARY"
            echo "Component: Multi-container orchestration & Docker Buildx" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Status: **SKIPPED**" >> "$GITHUB_STEP_SUMMARY"
            echo "Reason: \`docker-compose.yml\` or component directories not present on target branch." >> "$GITHUB_STEP_SUMMARY"
          fi
