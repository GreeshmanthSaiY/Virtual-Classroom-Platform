name: Integration Validation

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: int-val-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Full-Stack Verification on Develop Branch
  # ============================================================================
  integration-verification:
    name: Full-Stack Integration Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Grant execute permission to Maven wrapper
        run: chmod +x backend/mvnw

      - name: Frontend Dependencies & Production Build
        run: |
          cd frontend
          npm ci
          npm run build
          npm test -- --run

      - name: Backend Tests with Real PostgreSQL 16 Service Container
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/testdb
          POSTGRES_TEST_USER: postgres
          POSTGRES_TEST_PASSWORD: postgrespassword
        run: |
          cd backend
          ./mvnw clean test -Dspring.profiles.active=test \
            -Dflyway.test.jdbc-url=jdbc:postgresql://localhost:5432/testdb \
            -Dflyway.test.user=postgres \
            -Dflyway.test.password=postgrespassword
          ./mvnw clean package -DskipTests

      - name: Install PostgreSQL client utilities
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate Flyway schema history & integrity via direct PSQL
        env:
          PGPASSWORD: postgrespassword
        run: |
          echo "--- Checking applied Flyway schema history ---"
          psql -h localhost -U postgres -d testdb -c "SELECT installed_rank, version, description, type, success FROM flyway_schema_history ORDER BY installed_rank;"

          echo "--- Verifying zero demo users remain in migrated database ---"
          DEMO_COUNT=$(psql -h localhost -U postgres -d testdb -t -c "SELECT COUNT(*) FROM users WHERE email IN ('admin@virtualclassroom.edu', 'dr.jeevan@virtualclassroom.edu', 'gaurav.shukla@virtualclassroom.edu');" | xargs)
          if [ "$DEMO_COUNT" -ne "0" ]; then
            echo "ERROR: Demo users detected in migrated database! Count: $DEMO_COUNT"
            exit 1
          fi
          echo "Demo user count: 0 (Purge verified)"

          echo "--- Verifying foreign key relationships and schema constraints ---"
          psql -h localhost -U postgres -d testdb -c "
            SELECT conname, contype, conrelid::regclass AS table_from, confrelid::regclass AS table_to
            FROM pg_constraint
            WHERE contype IN ('f', 'u') AND connamespace = 'public'::regnamespace
            ORDER BY table_from, conname;
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose specification
        env:
          JWT_SECRET: "ci_docker_compose_config_secret_minimum_256_bits_length"
        run: docker compose config

      - name: Build Docker artifacts
        run: |
          docker build -t virtual-classroom-backend:develop -f backend/Dockerfile backend/
          docker build -t virtual-classroom-frontend:develop -f frontend/Dockerfile frontend/
