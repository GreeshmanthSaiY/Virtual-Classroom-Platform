name: Integration Validation

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: int-val-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Full-Stack Verification on Develop Branch
  # ============================================================================
  integration-verification:
    name: Full-Stack Integration Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Grant execute permission to Maven wrapper
        run: chmod +x backend/mvnw

      - name: Frontend Dependencies & Production Build
        run: |
          cd frontend
          npm ci
          npm run build
          npm test -- --run

      - name: Backend Tests with Real PostgreSQL 16 Service Container
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/testdb
          POSTGRES_TEST_USER: postgres
          POSTGRES_TEST_PASSWORD: postgrespassword
        run: |
          cd backend
          ./mvnw clean test -Dspring.profiles.active=test \
            -Dflyway.test.jdbc-url=jdbc:postgresql://localhost:5432/testdb \
            -Dflyway.test.user=postgres \
            -Dflyway.test.password=postgrespassword
          ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose specification
        run: docker compose config

      - name: Build Docker artifacts
        run: |
          docker build -t virtual-classroom-backend:develop -f backend/Dockerfile backend/
          docker build -t virtual-classroom-frontend:develop -f frontend/Dockerfile frontend/
