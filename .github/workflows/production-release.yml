name: Production Release

# ==============================================================================
# Production Release Pipeline - Gated by Approved Main History & Manual Approval
# ==============================================================================
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag matching SemVer (e.g. v1.0.0 or v1.0.0-rollback.1)'
        required: true
        type: string
      is_rollback:
        description: 'Set to true ONLY if intentionally rolling back to a previous approved release commit'
        required: false
        default: false
        type: boolean
      rollback_target_commit:
        description: 'If rollback: the exact commit SHA on main to deploy (e.g. 11d5f95)'
        required: false
        type: string
      rollback_reason:
        description: 'If rollback: mandatory auditable justification (minimum 20 characters)'
        required: false
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  # ============================================================================
  # 1. Production Release Safety Guard & Approved Policy Gate
  # ============================================================================
  production-guard:
    name: Production Release Policy & Ancestry Gate
    runs-on: ubuntu-latest
    outputs:
      target_commit: ${{ steps.verify-policy.outputs.target_commit }}
      release_type: ${{ steps.verify-policy.outputs.release_type }}
      release_version: ${{ steps.verify-policy.outputs.release_version }}

    steps:
      - name: Checkout repository with full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin main branch
        run: |
          echo "Fetching latest origin/main..."
          git fetch origin main

      - name: Verify release commit satisfies approved production release policy
        id: verify-policy
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_IS_ROLLBACK: ${{ inputs.is_rollback }}
          INPUT_ROLLBACK_TARGET_COMMIT: ${{ inputs.rollback_target_commit }}
          INPUT_ROLLBACK_REASON: ${{ inputs.rollback_reason }}
        run: |
          RAW_REF="${GITHUB_REF}"
          RAW_SHA="${GITHUB_SHA}"
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          INPUT_VERSION="${INPUT_RELEASE_VERSION}"
          IS_ROLLBACK="${INPUT_IS_ROLLBACK:-false}"
          ROLLBACK_COMMIT="${INPUT_ROLLBACK_TARGET_COMMIT:-}"
          ROLLBACK_REASON="${INPUT_ROLLBACK_REASON:-}"

          LEGACY_BASELINE="ef9b13c9264ea4f364672993a548597342ed5e9e"

          # Determine target version string
          if [[ "$RAW_REF" == refs/tags/* ]]; then
            VERSION="$TAG_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi

          echo "================================================================"
          echo "Production Release Policy Verification"
          echo "Target Ref:     $RAW_REF"
          echo "Target Commit:  $RAW_SHA"
          echo "Target Version: $VERSION"
          echo "Is Rollback:    $IS_ROLLBACK"
          echo "================================================================"

          # --------------------------------------------------------------------
          # 1. Validate Version Tag Format (Strict SemVer)
          # --------------------------------------------------------------------
          SEMVER_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error ::Invalid release version '$VERSION'. Releases must strictly follow SemVer (e.g. v1.0.0, v1.0.1, v1.0.0-rollback.1)."
            exit 1
          fi
          echo "[PASS] Valid SemVer format: $VERSION"

          # --------------------------------------------------------------------
          # 2. Determine Effective Commit to Release
          # --------------------------------------------------------------------
          if [ "$IS_ROLLBACK" = "true" ]; then
            RELEASE_TYPE="ROLLBACK"

            if [ -z "$ROLLBACK_COMMIT" ]; then
              echo "::error ::Rollback release requested, but 'rollback_target_commit' was not provided."
              exit 1
            fi

            if [ -z "$ROLLBACK_REASON" ] || [ ${#ROLLBACK_REASON} -lt 20 ]; then
              echo "::error ::Rollback release requires an auditable 'rollback_reason' of at least 20 characters."
              exit 1
            fi

            if ! TARGET_COMMIT=$(git rev-parse --verify "${ROLLBACK_COMMIT}^{commit}" 2>/dev/null); then
              echo "::error ::Invalid rollback commit reference '${ROLLBACK_COMMIT}'."
              exit 1
            fi

            echo "[ROLLBACK MODE] Target Rollback Commit: $TARGET_COMMIT"
            echo "[ROLLBACK MODE] Justification: $ROLLBACK_REASON"
          else
            RELEASE_TYPE="NORMAL"
            TARGET_COMMIT="$RAW_SHA"
          fi

          # --------------------------------------------------------------------
          # 3. Strict Ancestry & Reachability Check against origin/main
          # --------------------------------------------------------------------
          if ! git merge-base --is-ancestor "$TARGET_COMMIT" origin/main; then
            echo "::error ::REJECTED: Commit $TARGET_COMMIT is NOT reachable from origin/main!"
            echo "Releases may NOT originate from unmerged development branches (e.g. develop, update-local)."
            echo "Changes must be reviewed, approved, and merged into main before creating a production release."
            exit 1
          fi
          echo "[PASS] Commit $TARGET_COMMIT is confirmed reachable from origin/main."

          # --------------------------------------------------------------------
          # 4. Reject Historical Legacy Baseline (ef9b13c and prior commits)
          # --------------------------------------------------------------------
          if [ "$TARGET_COMMIT" = "$LEGACY_BASELINE" ] || git merge-base --is-ancestor "$TARGET_COMMIT" "$LEGACY_BASELINE"; then
            echo "::error ::REJECTED: Commit $TARGET_COMMIT is the legacy pre-milestone baseline ($LEGACY_BASELINE) or older."
            echo "Legacy prototype code cannot be deployed to production under any circumstances."
            exit 1
          fi
          echo "[PASS] Commit $TARGET_COMMIT is distinct from and newer than legacy baseline $LEGACY_BASELINE."

          # --------------------------------------------------------------------
          # 5. Approved Release Policy Enforcement: Normal vs Rollback
          # --------------------------------------------------------------------
          MAIN_HEAD=$(git rev-parse origin/main)

          if [ "$RELEASE_TYPE" = "NORMAL" ]; then
            if [ "$TARGET_COMMIT" != "$MAIN_HEAD" ]; then
              echo "::error ::REJECTED: Commit $TARGET_COMMIT is an historical commit on main, not the current HEAD ($MAIN_HEAD)."
              echo "Normal production releases must always point to the approved current HEAD of origin/main."
              echo "If you intend to rollback to an earlier approved commit, use workflow_dispatch with is_rollback=true, rollback_target_commit, and rollback_reason."
              exit 1
            fi
            echo "[PASS] Approved Normal Release: Commit matches current HEAD of origin/main ($MAIN_HEAD)."
          else
            if [ "$TARGET_COMMIT" = "$MAIN_HEAD" ]; then
              echo "::warning ::Rollback was requested, but specified commit is already the current HEAD of origin/main."
            fi
            echo "[PASS] Approved Rollback Release: Commit $TARGET_COMMIT approved with audit trail."
          fi

          # --------------------------------------------------------------------
          # 6. Set Outputs for Subsequent Jobs
          # --------------------------------------------------------------------
          echo "target_commit=$TARGET_COMMIT" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Preflight check of required production secrets
        env:
          RENDER_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID_PROD: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
          PROD_BACKEND: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          echo "Verifying required production release secrets..."
          MISSING_SECRETS=()

          if [ -z "$RENDER_HOOK" ]; then
            MISSING_SECRETS+=("RENDER_PRODUCTION_DEPLOY_HOOK_URL")
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            MISSING_SECRETS+=("VERCEL_TOKEN")
          fi
          if [ -z "$VERCEL_PROJECT_ID_PROD" ]; then
            MISSING_SECRETS+=("VERCEL_PROJECT_ID_PROD")
          fi
          if [ -z "$PROD_BACKEND" ]; then
            MISSING_SECRETS+=("PRODUCTION_BACKEND_URL")
          fi

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "::error ::Missing required production deployment secrets in GitHub Environment 'production':"
            for s in "${MISSING_SECRETS[@]}"; do
              echo "  - $s"
            done
            echo "Aborting production release before any deployment action. Configure production secrets in Repository Settings -> Environments -> production."
            exit 1
          fi
          echo "All required production secrets are configured."

  # ============================================================================
  # 2. Production Deployment (Gated by production environment approval)
  # ============================================================================
  deploy-production:
    name: Deploy to Production Environment
    needs: [production-guard]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy-frontend.outputs.prod_url }}
    outputs:
      prod_url: ${{ steps.deploy-frontend.outputs.prod_url }}

    steps:
      - name: Checkout repository at verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.production-guard.outputs.target_commit }}

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step A: Deploy Backend to Render Production Web Service
      - name: Deploy Backend to Render Production
        id: deploy-backend
        env:
          RENDER_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render Production deploy hook..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_HOOK_URL")
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "Render production deploy hook succeeded (HTTP $HTTP_STATUS)."
          else
            echo "::error ::Render production deploy hook failed with status $HTTP_STATUS."
            exit 1
          fi

      # Step B: Deploy Frontend to Vercel Production
      - name: Deploy Frontend to Vercel Production
        id: deploy-frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
        run: |
          echo "Installing Vercel CLI..."
          npm install -g vercel@latest
          cd frontend
          echo "Pulling Vercel Production Environment Information..."
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          echo "Building artifacts for production..."
          vercel build --prod --token="$VERCEL_TOKEN"
          echo "Deploying prebuilt artifacts to Vercel Production..."
          PROD_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          if [ -z "$PROD_URL" ]; then
            echo "::error ::Vercel deploy command returned empty production URL."
            exit 1
          fi
          echo "Production URL: $PROD_URL"
          echo "prod_url=$PROD_URL" >> $GITHUB_OUTPUT

  # ============================================================================
  # 3. Post-Deployment Production Live Smoke Tests (Separated Job)
  # ============================================================================
  production-smoke-tests:
    name: Production Live Health & Contract Verification
    needs: [production-guard, deploy-production]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository at verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.production-guard.outputs.target_commit }}

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate production endpoint URLs
        id: validate-urls
        env:
          FRONTEND_URL: ${{ needs.deploy-production.outputs.prod_url || secrets.PRODUCTION_FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          echo "Validating production endpoint URLs..."
          if [ -z "$FRONTEND_URL" ]; then
            echo "::error ::Production frontend URL is empty or unverified."
            exit 1
          fi
          if [ -z "$BACKEND_URL" ]; then
            echo "::error ::PRODUCTION_BACKEND_URL secret is empty or unverified."
            exit 1
          fi
          if [[ ! "$FRONTEND_URL" =~ ^https?:// ]]; then
            echo "::error ::Invalid frontend URL format: $FRONTEND_URL"
            exit 1
          fi
          if [[ ! "$BACKEND_URL" =~ ^https?:// ]]; then
            echo "::error ::Invalid backend URL format: $BACKEND_URL"
            exit 1
          fi
          echo "Target Frontend: $FRONTEND_URL"
          echo "Target Backend:  $BACKEND_URL"
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

      - name: Execute Live Production Smoke Tests
        env:
          FRONTEND_URL: ${{ steps.validate-urls.outputs.frontend_url }}
          BACKEND_URL: ${{ steps.validate-urls.outputs.backend_url }}
        run: |
          echo "Verifying live production health and contract status..."
          node scripts/staging_smoke_tests.js --frontend="$FRONTEND_URL" --backend="$BACKEND_URL"
