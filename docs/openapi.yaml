openapi: 3.0.3
info:
  title: Virtual Classroom Platform REST API
  description: Authoritative Enterprise OpenAPI Specification for the Virtual Classroom Platform
  version: 1.0.0
  contact:
    name: Virtual Classroom Engineering Team
    email: security@virtualclassroom.edu

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
  - url: https://api.virtualclassroom.edu/api/v1
    description: Production Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token obtained from /auth/login

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/UserDto'

    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [ROLE_STUDENT, ROLE_FACULTY, ROLE_ADMIN]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, SUSPENDED, DISABLED]
        rejectionReason:
          type: string
        rollNumber:
          type: string
        employeeId:
          type: string
        department:
          type: string
        courseName:
          type: string
        currentYear:
          type: integer
        avatarUrl:
          type: string
        phoneNumber:
          type: string
        createdAt:
          type: string
          format: date-time

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        phoneNumber:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
        designation:
          type: string
        officeHours:
          type: string

    SubjectDto:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: integer
        courseName:
          type: string
        code:
          type: string
        title:
          type: string
        yearLevel:
          type: integer
        semester:
          type: integer
        credits:
          type: integer
        description:
          type: string

    AssignmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        subjectId:
          type: integer
        subjectCode:
          type: string
        subjectTitle:
          type: string
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string
          format: date-time
        maxPoints:
          type: integer
        attachmentUrl:
          type: string
        createdByName:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateAssignmentRequest:
      type: object
      required: [subjectId, title, description, dueDate]
      properties:
        subjectId:
          type: integer
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string
          format: date-time
        maxPoints:
          type: integer
        attachmentUrl:
          type: string

    AssignmentSubmissionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        assignmentId:
          type: integer
          format: int64
        assignmentTitle:
          type: string
        studentId:
          type: integer
          format: int64
        studentName:
          type: string
        studentEmail:
          type: string
        submissionText:
          type: string
        fileUrl:
          type: string
        submittedAt:
          type: string
          format: date-time
        gradePoints:
          type: integer
        maxPoints:
          type: integer
        feedback:
          type: string
        gradedByName:
          type: string
        gradedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [DRAFT, SUBMITTED, LATE, GRADED, RESUBMISSION_REQUESTED]

    SubmitAssignmentRequest:
      type: object
      required: [assignmentId]
      properties:
        assignmentId:
          type: integer
          format: int64
        submissionText:
          type: string
        fileUrl:
          type: string

    GradeSubmissionRequest:
      type: object
      required: [gradePoints]
      properties:
        gradePoints:
          type: integer
        feedback:
          type: string

    LiveSessionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        subjectId:
          type: integer
        subjectCode:
          type: string
        subjectTitle:
          type: string
        hostFacultyId:
          type: integer
          format: int64
        hostFacultyName:
          type: string
        title:
          type: string
        description:
          type: string
        meetingLink:
          type: string
        platform:
          type: string
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        status:
          type: string
          enum: [SCHEDULED, LIVE, COMPLETED, CANCELLED]

    CreateLiveSessionRequest:
      type: object
      required: [subjectId, title, meetingLink, scheduledStart, scheduledEnd]
      properties:
        subjectId:
          type: integer
        title:
          type: string
        description:
          type: string
        meetingLink:
          type: string
        platform:
          type: string
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time

    ExaminationDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        subjectId:
          type: integer
        subjectCode:
          type: string
        subjectTitle:
          type: string
        createdByName:
          type: string
        title:
          type: string
        examType:
          type: string
          enum: [QUIZ, MIDTERM, FINAL, LAB_PRACTICAL]
        totalMarks:
          type: integer
        durationMinutes:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        instructions:
          type: string

    CreateExaminationRequest:
      type: object
      required: [subjectId, title, examType, totalMarks, durationMinutes, scheduledAt]
      properties:
        subjectId:
          type: integer
        title:
          type: string
        examType:
          type: string
          enum: [QUIZ, MIDTERM, FINAL, LAB_PRACTICAL]
        totalMarks:
          type: integer
        durationMinutes:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        instructions:
          type: string

    ExaminationResultDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        examinationId:
          type: integer
          format: int64
        examinationTitle:
          type: string
        examType:
          type: string
        totalMarks:
          type: integer
        studentId:
          type: integer
          format: int64
        studentName:
          type: string
        studentRollNumber:
          type: string
        marksObtained:
          type: number
        grade:
          type: string
        remarks:
          type: string
        gradedByName:
          type: string
        gradedAt:
          type: string
          format: date-time

    RecordGradeRequest:
      type: object
      required: [examinationId, studentId, marksObtained]
      properties:
        examinationId:
          type: integer
          format: int64
        studentId:
          type: integer
          format: int64
        marksObtained:
          type: number
        grade:
          type: string
        remarks:
          type: string

    StudentEnrollmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        studentId:
          type: integer
          format: int64
        studentName:
          type: string
        rollNumber:
          type: string
        subjectId:
          type: integer
        subjectCode:
          type: string
        subjectTitle:
          type: string
        academicTerm:
          type: string
        status:
          type: string
          enum: [ENROLLED, COMPLETED, DROPPED]
        enrolledAt:
          type: string
          format: date-time

    StudyMaterialDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        subjectId:
          type: integer
        subjectTitle:
          type: string
        uploaderId:
          type: integer
          format: int64
        uploaderName:
          type: string
        title:
          type: string
        description:
          type: string
        fileUrl:
          type: string
        fileSizeBytes:
          type: integer
          format: int64
        mimeType:
          type: string
        createdAt:
          type: string
          format: date-time

    VideoLectureDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        subjectId:
          type: integer
        subjectTitle:
          type: string
        facultyId:
          type: integer
          format: int64
        facultyName:
          type: string
        title:
          type: string
        description:
          type: string
        videoUrl:
          type: string
        durationSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time

    QuestionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        subjectId:
          type: integer
        subjectTitle:
          type: string
        authorId:
          type: integer
          format: int64
        authorName:
          type: string
        authorRole:
          type: string
        title:
          type: string
        body:
          type: string
        isResolved:
          type: boolean
        answersCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerDto'

    AnswerDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        questionId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        authorName:
          type: string
        authorRole:
          type: string
        body:
          type: string
        isAccepted:
          type: boolean
        createdAt:
          type: string
          format: date-time

paths:
  /auth/login:
    post:
      summary: Authenticate user credentials and issue JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
        '401':
          description: Bad credentials or unapproved account

  /auth/register/student:
    post:
      summary: Submit student registration request
      responses:
        '200':
          description: Registration submitted with PENDING status

  /auth/register/faculty:
    post:
      summary: Submit faculty registration request
      responses:
        '200':
          description: Registration submitted with PENDING status

  /auth/me:
    get:
      security:
        - BearerAuth: []
      summary: Get authenticated user identity and role
      responses:
        '200':
          description: User identity returned

  /courses/degrees:
    get:
      summary: List all academic degrees
      responses:
        '200':
          description: List of degrees

  /courses/by-degree/{degreeId}:
    get:
      summary: List courses offered under a degree
      parameters:
        - name: degreeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of courses

  /students/subjects:
    get:
      security:
        - BearerAuth: []
      summary: Get subjects matching student's enrolled course and year
      responses:
        '200':
          description: Enrolled subjects

  /students/materials:
    get:
      security:
        - BearerAuth: []
      summary: Get study materials for all enrolled subjects
      parameters:
        - name: subjectId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Study materials

  /students/lectures:
    get:
      security:
        - BearerAuth: []
      summary: Get video lectures for all enrolled subjects
      parameters:
        - name: subjectId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Video lectures

  /faculty/subjects:
    get:
      security:
        - BearerAuth: []
      summary: Get subjects assigned to faculty
      responses:
        '200':
          description: Assigned subjects

  /faculty/materials:
    get:
      security:
        - BearerAuth: []
      summary: Get materials uploaded by faculty
      parameters:
        - name: subjectId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Materials list
    post:
      security:
        - BearerAuth: []
      summary: Upload new study material to an assigned subject
      responses:
        '200':
          description: Material published
        '403':
          description: Faculty not assigned to subject

  /faculty/lectures:
    get:
      security:
        - BearerAuth: []
      summary: Get video lectures published by faculty
      parameters:
        - name: subjectId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Lectures list
    post:
      security:
        - BearerAuth: []
      summary: Publish new video lecture to an assigned subject
      responses:
        '200':
          description: Lecture published
        '403':
          description: Faculty not assigned to subject

  /discussions/questions:
    get:
      security:
        - BearerAuth: []
      summary: Get questions across subjects or for a specific subject
      parameters:
        - name: subjectId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Questions retrieved
    post:
      security:
        - BearerAuth: []
      summary: Post a new discussion thread
      responses:
        '200':
          description: Question created

  /discussions/answers/{answerId}/accept:
    patch:
      security:
        - BearerAuth: []
      summary: Mark an answer as accepted
      parameters:
        - name: answerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Answer marked as accepted

  /admin/metrics:
    get:
      security:
        - BearerAuth: []
      summary: Get platform telemetry and analytics
      responses:
        '200':
          description: Metrics object
        '403':
          description: Admin access required

  /admin/approvals:
    post:
      security:
        - BearerAuth: []
      summary: Approve user registration requests
      responses:
        '200':
          description: Users approved
        '403':
          description: Admin access required

  /admin/rejections:
    post:
      security:
        - BearerAuth: []
      summary: Reject user registration requests with reason
      responses:
        '200':
          description: Users rejected
        '403':
          description: Admin access required

  /auth/refresh:
    post:
      summary: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      security:
        - BearerAuth: []
      summary: Revoke active refresh token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logged out and session invalidated

  /users/profile:
    get:
      security:
        - BearerAuth: []
      summary: Get active user profile
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
    put:
      security:
        - BearerAuth: []
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  /enrollments:
    post:
      security:
        - BearerAuth: []
      summary: Enroll student into an academic subject
      parameters:
        - name: studentId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
        - name: term
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Student successfully enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentDto'

  /enrollments/student/{studentId}:
    get:
      security:
        - BearerAuth: []
      summary: Get student enrollments
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of enrollments

  /enrollments/subject/{subjectId}:
    get:
      security:
        - BearerAuth: []
      summary: Get subject class roster
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of student enrollments in subject

  /assignments:
    post:
      security:
        - BearerAuth: []
      summary: Create new coursework assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '200':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentDto'

  /assignments/subject/{subjectId}:
    get:
      security:
        - BearerAuth: []
      summary: Get paged assignments for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paged assignments

  /assignments/{id}/submit:
    post:
      security:
        - BearerAuth: []
      summary: Submit assignment solution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAssignmentRequest'
      responses:
        '200':
          description: Submission recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentSubmissionDto'

  /assignments/{id}/submissions:
    get:
      security:
        - BearerAuth: []
      summary: Get submissions for an assignment (instructor view)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of student submissions

  /assignments/submissions/{id}/grade:
    post:
      security:
        - BearerAuth: []
      summary: Grade assignment submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
      responses:
        '200':
          description: Submission graded

  /sessions:
    post:
      security:
        - BearerAuth: []
      summary: Schedule live classroom session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiveSessionRequest'
      responses:
        '200':
          description: Session scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSessionDto'

  /sessions/subject/{subjectId}:
    get:
      security:
        - BearerAuth: []
      summary: Get paged live sessions for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Paged live sessions

  /sessions/{id}/status:
    patch:
      security:
        - BearerAuth: []
      summary: Update session status (LIVE, COMPLETED, CANCELLED)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [SCHEDULED, LIVE, COMPLETED, CANCELLED]
      responses:
        '200':
          description: Status updated

  /examinations:
    post:
      security:
        - BearerAuth: []
      summary: Schedule formal examination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExaminationRequest'
      responses:
        '200':
          description: Examination scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExaminationDto'

  /examinations/subject/{subjectId}:
    get:
      security:
        - BearerAuth: []
      summary: Get examinations for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Paged examinations

  /examinations/grade:
    post:
      security:
        - BearerAuth: []
      summary: Record grade for an examination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordGradeRequest'
      responses:
        '200':
          description: Grade recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExaminationResultDto'

  /examinations/{id}/results:
    get:
      security:
        - BearerAuth: []
      summary: Get all results for an examination (instructor)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Results list

  /examinations/results/my:
    get:
      security:
        - BearerAuth: []
      summary: Get student transcript of results
      responses:
        '200':
          description: Personal results list

