version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: virtual-classroom-db
    restart: always
    environment:
      POSTGRES_DB: virtual_classroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtual_classroom"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: virtual-classroom-backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/virtual_classroom
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET: c2VjdXJlLXZpcnR1YWwtY2xhc3Nyb29tLXBsYXRmb3JtLWtleS0yMDI2LWVudGVycHJpc2Utc2VjdXJl
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: virtual-classroom-frontend
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:

