spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/virtual_classroom?sslmode=prefer}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:dGVzdC1sb2NhbC1kZXZlbG9wbWVudC1zZWNyZXQta2V5LWZvci12aXJ0dWFsLWNsYXNzcm9vbQ==}


