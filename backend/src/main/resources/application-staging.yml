# ==============================================================================
# Virtual Classroom Platform - Staging Environment Configuration Profile
# Hardened per Milestone 18.2.1 / 18.3 Security Remediation
# ==============================================================================
server:
  error:
    include-message: never
    include-binding-errors: never

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 30000
      initialization-fail-timeout: 1
      pool-name: VirtualClassroomStagingPool
      data-source-properties:
        sslmode: require
        prepareThreshold: 5
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5
        ApplicationName: virtual-classroom-staging
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
    baseline-on-migrate: false
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:None}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://virtual-classroom-staging.vercel.app}
  storage:
    provider: ${STORAGE_PROVIDER:supabase}
    supabase:
      url: ${SUPABASE_URL}
      key: ${SUPABASE_SERVICE_ROLE_KEY}
      bucket: ${SUPABASE_STORAGE_BUCKET:academic-assets}
